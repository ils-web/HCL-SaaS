<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/worker-manifest.json">
    <title>Worker App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #eef2f6; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .task-card { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        /* Fullscreen Viewer */
        #fullscreenViewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        #fullscreenViewer.active { display: flex; animation: fadeIn 0.2s ease-out; }
        #fsImage { max-width: 95%; max-height: 82%; object-fit: contain; border-radius: 12px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        /* Loader */
        .loader { border: 3px solid #e2e8f0; border-top: 3px solid #4f46e5; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.9s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Modal */
        #completionModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 50; justify-content: center; align-items: flex-end; }
        #completionModal.active { display: flex; animation: fadeIn 0.2s; }
        .modal-content { background: white; width: 100%; max-width: 540px; border-radius: 24px 24px 0 0; padding: 22px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="glass-header fixed top-0 w-full z-40 border-b border-slate-200 shadow-sm px-4 pt-4 pb-3">
        <div class="max-w-lg mx-auto flex justify-between items-center gap-2">
            <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                    <h1 id="uiTitle" class="text-xl font-black text-indigo-950 tracking-tight truncate">משימות</h1>
                    <span id="tasksCountBadge" class="hidden bg-indigo-600 text-white text-xs font-black px-2.5 py-0.5 rounded-full shadow-xs">0</span>
                </div>
                <p id="uiWorkerName" class="text-xs font-bold text-slate-500 truncate mt-0.5">טוען...</p>
            </div>

            <!-- Language Switcher + Bell + Refresh -->
            <div class="flex items-center gap-1.5 shrink-0">
                <div class="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200 text-xs font-black" dir="ltr">
                    <button onclick="switchLanguage('he')" id="langBtn-he" class="px-2 py-1 rounded-md transition-all">HE</button>
                    <button onclick="switchLanguage('ru')" id="langBtn-ru" class="px-2 py-1 rounded-md transition-all">RU</button>
                    <button onclick="switchLanguage('ar')" id="langBtn-ar" class="px-2 py-1 rounded-md transition-all">AR</button>
                    <button onclick="switchLanguage('en')" id="langBtn-en" class="px-2 py-1 rounded-md transition-all">EN</button>
                </div>
                <button onclick="fetchTasks(true)" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 flex items-center justify-center transition-colors border border-slate-200" title="Refresh">
                    <i id="refreshIcon" class="fas fa-sync-alt text-sm"></i>
                </button>
                <button id="bellBtn" onclick="togglePersistentBell()" class="px-2.5 h-9 rounded-xl bg-amber-500 text-white font-black text-xs flex items-center justify-center gap-1.5 transition-all shadow-sm animate-pulse" title="Notifications">
                    <i id="notifIcon" class="fas fa-bell text-sm"></i>
                    <span id="bellStatusTxt" class="hidden sm:inline">ON</span>
                </button>
            </div>
        </div>
        <!-- Prompt banner if notifications/sound are not yet activated -->
        <div id="bellActivateBanner" onclick="enableBellAndPush(true)" class="hidden max-w-lg mx-auto mt-2.5 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-xl px-3.5 py-2 text-xs font-black flex items-center justify-between gap-2 cursor-pointer shadow-sm active:scale-98 transition-transform">
            <div class="flex items-center gap-2">
                <i class="fas fa-volume-up text-base animate-bounce"></i>
                <span id="bellBannerText">לחץ כאן להפעלת התראות קוליות חזקות (פועל תמיד גם ברקע!)</span>
            </div>
            <span class="bg-white text-orange-600 px-2.5 py-1 rounded-lg text-[11px] font-black shrink-0" id="bellBannerBtn">הפעל 🔔</span>
        </div>
        <!-- Flashing active alarm banner when a new task arrives -->
        <div id="activeAlarmBanner" onclick="stopPersistentAlarmLoop()" class="hidden max-w-lg mx-auto mt-2.5 bg-gradient-to-r from-rose-600 via-red-600 to-amber-600 text-white rounded-xl px-4 py-3 text-sm font-black flex items-center justify-between gap-2 cursor-pointer shadow-lg ring-4 ring-rose-300 animate-bounce">
            <div class="flex items-center gap-2.5">
                <i class="fas fa-bell text-xl"></i>
                <span id="activeAlarmText">🚨 התקבלה משימה חדשה! לחץ לעצירת הצלצול</span>
            </div>
            <span class="bg-white text-rose-700 px-3 py-1 rounded-lg text-xs font-black shrink-0">עצור 🔇</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-24 px-3 max-w-lg mx-auto" id="tasksContainer">
        <div class="flex justify-center mt-14"><div class="loader"></div></div>
    </main>

    <!-- Completion Modal -->
    <div id="completionModal">
        <div class="modal-content shadow-2xl">
            <div class="flex justify-between items-start mb-3 border-b border-slate-100 pb-3">
                <div>
                    <h2 id="modalTitle" class="text-xl font-black text-slate-800">סיום משימה</h2>
                    <p id="modalTaskSubtitle" class="text-xs font-bold text-indigo-600 mt-0.5"></p>
                </div>
                <button onclick="closeCompletionModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 flex items-center justify-center"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="mb-4">
                <label id="modalCommentLbl" class="block text-sm font-bold text-slate-700 mb-1.5">הערת ביצוע (אופציונלי)</label>
                <!-- Quick Chips -->
                <div id="quickChipsContainer" class="flex flex-wrap gap-1.5 mb-2"></div>
                <textarea id="completionComment" class="w-full border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-medium bg-slate-50 focus:bg-white" rows="2"></textarea>
            </div>

            <div class="mb-5">
                <label id="modalPhotoLbl" class="block text-sm font-bold text-slate-700 mb-1.5">תמונה לאחר ביצוע</label>
                <div id="photoUploadBox" class="border-2 border-dashed border-indigo-200 rounded-2xl p-4 text-center cursor-pointer bg-indigo-50/40 hover:bg-indigo-50 transition-colors" onclick="document.getElementById('fileInput').click()">
                    <i id="photoIcon" class="fas fa-camera text-indigo-500 text-3xl mb-1.5"></i>
                    <p id="photoText" class="text-indigo-900 font-bold text-sm">לחץ לצילום תמונת סיום</p>
                    <img id="photoPreview" class="hidden mt-3 max-h-40 mx-auto rounded-xl shadow-md border border-white" />
                </div>
                <input type="file" id="fileInput" class="hidden" accept="image/*" capture="environment" onchange="handlePhotoSelect(event)">
            </div>

            <button id="submitCompletionBtn" onclick="submitTaskCompletion()" class="w-full bg-emerald-600 text-white font-black py-4 rounded-xl shadow-lg hover:bg-emerald-700 active:bg-emerald-800 transition-colors flex justify-center items-center gap-2 text-base">
                <i class="fas fa-check-circle"></i>
                <span id="submitBtnTxt">אשר וסיים משימה</span>
            </button>
        </div>
    </div>

    <!-- Fullscreen Viewer -->
    <div id="fullscreenViewer" onclick="closeFullscreen()">
        <button class="absolute top-6 right-6 w-10 h-10 rounded-full bg-white/20 text-white text-xl flex items-center justify-center"><i class="fas fa-times"></i></button>
        <img id="fsImage" src="" alt="Fullscreen">
    </div>

                notFound: 'Worker not found. Please scan your QR code again.',
                noTasks: 'No open tasks right now! Great job 🎉',

                dept: 'Department',

                system: 'System',

                reworkInstruction: 'Manager Rework Instructions:',

        const browserLang = (navigator.language || 'he').slice(0, 2).toLowerCase();
        let currentLang = localStorage.getItem('worker_lang') || (dict[browserLang] ? browserLang : 'he');
        if (!dict[currentLang]) currentLang = 'he';
        let t = dict[currentLang];

        function applyLanguageUI() {
            t = dict[currentLang] || dict['he'];
            const isRtl = (currentLang === 'he' || currentLang === 'ar');
            document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
            document.documentElement.lang = currentLang;

            ['he', 'ru', 'ar', 'en'].forEach(l => {
                const btn = document.getElementById('langBtn-' + l);
                if (!btn) return;
                if (l === currentLang) {
                    btn.className = 'px-2 py-1 rounded-md bg-indigo-600 text-white shadow-xs transition-all';
                } else {
                    btn.className = 'px-2 py-1 rounded-md text-slate-600 hover:bg-slate-200 transition-all';
                }
            });

            document.getElementById('uiTitle').innerText = t.title;
            document.getElementById('modalTitle').innerText = t.markDone;
            document.getElementById('modalCommentLbl').innerText = t.commentLbl;
            document.getElementById('completionComment').placeholder = t.commentPlaceholder;
            document.getElementById('modalPhotoLbl').innerText = t.photoLbl;
            if (!currentPhotoBase64) {
                document.getElementById('photoText').innerText = t.photoBox;
            }
            document.getElementById('submitBtnTxt').innerText = t.submit;

            const bellBannerTxt = document.getElementById('bellBannerText');
            const bellBannerBtn = document.getElementById('bellBannerBtn');
            const activeAlarmTxt = document.getElementById('activeAlarmText');
            if (bellBannerTxt && t.bellPromptBanner) bellBannerTxt.innerText = t.bellPromptBanner;
            if (bellBannerBtn && t.bellPromptBtn) bellBannerBtn.innerText = t.bellPromptBtn;
            if (activeAlarmTxt && t.alarmStopBanner) activeAlarmTxt.innerText = t.alarmStopBanner;

            // Render quick chips
            const chipsZone = document.getElementById('quickChipsContainer');
            if (chipsZone && t.quickChips) {
                chipsZone.innerHTML = t.quickChips.map(chip =>
                    `<button type="button" onclick="appendQuickChip('${chip.replace(/'/g, "\\'")}')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-800 border border-indigo-200 font-bold px-2.5 py-1 rounded-full transition-colors">${chip}</button>`
                ).join('');
            }
            updateBellButtonUI();
        }

        function appendQuickChip(text) {
            const inp = document.getElementById('completionComment');
            inp.value = inp.value ? (inp.value.trim() + ' — ' + text) : text;
        }

        async function switchLanguage(newLang) {
            if (!dict[newLang]) return;
            currentLang = newLang;
            localStorage.setItem('worker_lang', newLang);
            applyLanguageUI();
            if (vapidPublicKeyGlobal) {
                subscribeToWebPush(vapidPublicKeyGlobal).catch(() => {});
            }
            await fetchTasks(true);
        }

        // Params
        let tenantId = localStorage.getItem('worker_tenantId');
        let workerId = localStorage.getItem('worker_workerId');

        const params = new URLSearchParams(window.location.search);
        if (params.has('tenantId') && params.has('workerId')) {
            tenantId = params.get('tenantId');
            workerId = params.get('workerId');
            localStorage.setItem('worker_tenantId', tenantId);
            localStorage.setItem('worker_workerId', workerId);
            window.history.replaceState({}, document.title, "/worker.html");
        }

        const API_URL = tenantId ? `/api/${tenantId}` : '';
        let currentStateKeys = [];
        let cachedTasks = [];
        let pollingInterval = null;
        let workerInfo = null;
        let isFetchingTasks = false;
        let vapidPublicKeyGlobal = null;

        let activeTaskId = null;
        let currentPhotoBase64 = null;

        // Persistent Bell & Loud Dispatcher Alarm State
        let isBellEnabled = localStorage.getItem('worker_bell_enabled') !== 'false'; // Default ON
        let audioCtx = null;
        let loudAudioNormal = null;
        let loudAudioUrgent = null;
        let alarmRepeatTimer = null;
        let alarmRepeatCount = 0;
        let wakeLockSentinel = null;

        // Generate a crystal-clear, maximum-volume 3.4s WAV audio file in memory (plays even when backgrounded)
        function generateDispatcherWavDataUri(isUrgent = false) {
            const sampleRate = 22050;
            const durationSec = 3.4;
            const numSamples = Math.floor(sampleRate * durationSec);
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);

            const writeStr = (offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM
            view.setUint16(22, 1, true); // Mono
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, numSamples * 2, true);

            // Multi-tone high-penetration industrial pager frequencies (880Hz / 1175Hz / 1568Hz)
            const notes = isUrgent
                ? [
                    { start: 0.00, end: 0.32, f1: 987.77, f2: 1975.5 },
                    { start: 0.35, end: 0.67, f1: 1318.5, f2: 2637.0 },
                    { start: 0.72, end: 1.04, f1: 987.77, f2: 1975.5 },
                    { start: 1.07, end: 1.42, f1: 1318.5, f2: 2637.0 },
                    { start: 1.55, end: 1.87, f1: 987.77, f2: 1975.5 },
                    { start: 1.90, end: 2.22, f1: 1318.5, f2: 2637.0 },
                    { start: 2.27, end: 2.60, f1: 987.77, f2: 1975.5 },
                    { start: 2.63, end: 3.30, f1: 1567.98, f2: 3135.96 }
                ]
                : [
                    { start: 0.00, end: 0.26, f1: 880.0, f2: 1760.0 },
                    { start: 0.30, end: 0.56, f1: 1174.66, f2: 2349.3 },
                    { start: 0.60, end: 1.02, f1: 1567.98, f2: 3135.96 },
                    { start: 1.18, end: 1.44, f1: 880.0, f2: 1760.0 },
                    { start: 1.48, end: 1.74, f1: 1174.66, f2: 2349.3 },
                    { start: 1.78, end: 2.20, f1: 1567.98, f2: 3135.96 },
                    { start: 2.36, end: 2.62, f1: 880.0, f2: 1760.0 },
                    { start: 2.66, end: 3.32, f1: 1567.98, f2: 3135.96 }
                ];

            for (let i = 0; i < numSamples; i++) {
                const sec = i / sampleRate;
                let sample = 0;
                for (let n = 0; n < notes.length; n++) {
                    const note = notes[n];
                    if (sec >= note.start && sec <= note.end) {
                        const rel = sec - note.start;
                        const len = note.end - note.start;
                        const env = rel < 0.015 ? (rel / 0.015) : (rel > len - 0.025 ? (len - rel) / 0.025 : 1.0);
                        // Rich harmonic wave (fundamental + octave + soft square saturation) for maximum loudness on phone speakers
                        const s1 = Math.sin(2 * Math.PI * note.f1 * sec);
                        const s2 = Math.sin(2 * Math.PI * note.f2 * sec);
                        const sq = s1 >= 0 ? 0.45 : -0.45;
                        sample = Math.max(-0.98, Math.min(0.98, (s1 * 0.65 + s2 * 0.35 + sq) * env));
                        break;
                    }
                }
                view.setInt16(44 + i * 2, Math.floor(sample * 32760), true);
            }

            const bytes = new Uint8Array(buffer);
            let binary = '';
            const chunkSize = 8192;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return 'data:audio/wav;base64,' + btoa(binary);
        }

        function ensureAudioUnlocked() {
            try {
                if (!loudAudioNormal) {
                    loudAudioNormal = new Audio(generateDispatcherWavDataUri(false));
                    loudAudioNormal.volume = 1.0;
                }
                if (!loudAudioUrgent) {
                    loudAudioUrgent = new Audio(generateDispatcherWavDataUri(true));
                    loudAudioUrgent.volume = 1.0;
                }
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx && !audioCtx) {
                    audioCtx = new AudioCtx();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
            } catch (e) {}
        }

        function playWebAudioBoost(isUrgent = false) {
            try {
                ensureAudioUnlocked();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.setValueAtTime(-12, now);
                compressor.knee.setValueAtTime(10, now);
                compressor.ratio.setValueAtTime(8, now);
                compressor.attack.setValueAtTime(0.002, now);
                compressor.release.setValueAtTime(0.15, now);
                compressor.connect(audioCtx.destination);

                const pattern = isUrgent
                    ? [
                        { t: 0.0, d: 0.3, f: 987.77 },
                        { t: 0.34, d: 0.3, f: 1318.5 },
                        { t: 0.70, d: 0.3, f: 987.77 },
                        { t: 1.04, d: 0.35, f: 1318.5 },
                        { t: 1.50, d: 0.3, f: 987.77 },
                        { t: 1.84, d: 0.5, f: 1567.98 }
                    ]
                    : [
                        { t: 0.0, d: 0.25, f: 880.0 },
                        { t: 0.29, d: 0.25, f: 1174.66 },
                        { t: 0.58, d: 0.42, f: 1567.98 },
                        { t: 1.15, d: 0.25, f: 880.0 },
                        { t: 1.44, d: 0.25, f: 1174.66 },
                        { t: 1.73, d: 0.50, f: 1567.98 }
                    ];

                pattern.forEach(step => {
                    const osc1 = audioCtx.createOscillator();
                    const osc2 = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc1.type = 'sawtooth';
                    osc2.type = 'triangle';
                    osc1.frequency.setValueAtTime(step.f, now + step.t);
                    osc2.frequency.setValueAtTime(step.f * 2, now + step.t);

                    gain.gain.setValueAtTime(0.001, now + step.t);
                    gain.gain.exponentialRampToValueAtTime(0.95, now + step.t + 0.02);
                    gain.gain.setValueAtTime(0.95, now + step.t + step.d - 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + step.t + step.d);

                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(compressor);

                    osc1.start(now + step.t);
                    osc2.start(now + step.t);
                    osc1.stop(now + step.t + step.d);
                    osc2.stop(now + step.t + step.d);
                });
            } catch (e) {
                console.warn('WebAudio boost warning:', e);
            }
        }

        function playLoudDispatcherSiren(isUrgent = false) {
            if (!isBellEnabled) return;
            ensureAudioUnlocked();
            playWebAudioBoost(isUrgent);
            try {
                const player = isUrgent ? loudAudioUrgent : loudAudioNormal;
                if (player) {
                    player.currentTime = 0;
                    player.volume = 1.0;
                    player.play().catch(() => {});
                }
            } catch (e) {}
            if (navigator.vibrate) {
                navigator.vibrate(isUrgent ? [600, 150, 600, 150, 600, 150, 800] : [500, 150, 500, 150, 700, 150, 500]);
            }
        }

        function startPersistentAlarmLoop(msg, isUrgent = false) {
            if (!isBellEnabled) return;
            stopPersistentAlarmLoop();

            const banner = document.getElementById('activeAlarmBanner');
            const bannerTxt = document.getElementById('activeAlarmText');
            if (banner) {
                if (bannerTxt) bannerTxt.innerText = `🚨 ${msg || t.newTasks}`;
                banner.classList.remove('hidden');
            }

            playLoudDispatcherSiren(isUrgent);
            showSystemNotification(msg || t.newTasks, isUrgent);

            alarmRepeatCount = 0;
            alarmRepeatTimer = setInterval(() => {
                alarmRepeatCount++;
                if (alarmRepeatCount > 15 || !isBellEnabled) {
                    stopPersistentAlarmLoop();
                    return;
                }
                playLoudDispatcherSiren(isUrgent);
            }, 18000);
        }

        function stopPersistentAlarmLoop() {
            if (alarmRepeatTimer) {
                clearInterval(alarmRepeatTimer);
                alarmRepeatTimer = null;
            }
            const banner = document.getElementById('activeAlarmBanner');
            if (banner) banner.classList.add('hidden');
            try {
                if (loudAudioNormal) { loudAudioNormal.pause(); loudAudioNormal.currentTime = 0; }
                if (loudAudioUrgent) { loudAudioUrgent.pause(); loudAudioUrgent.currentTime = 0; }
            } catch (e) {}
        }

        async function showSystemNotification(titleText, isUrgent = false) {
            if (!("Notification" in window) || Notification.permission !== "granted") return;
            try {
                if ('serviceWorker' in navigator) {
                    const reg = await navigator.serviceWorker.ready;
                    if (reg && reg.showNotification) {
                        await reg.showNotification(titleText, {
                            body: workerInfo ? `${workerInfo.name} — ${t.whatToDo}` : t.noTasksSub,
                            icon: '/icon-192.png',
                            badge: '/icon-192.png',
                            vibrate: isUrgent ? [600, 150, 600, 150, 800] : [500, 150, 500, 150, 700],
                            requireInteraction: true,
                            renotify: true,
                            tag: 'hcl-worker-live-alert'
                        });
                        return;
                    }
                }
                new Notification(titleText, { icon: '/icon-192.png' });
            } catch (e) {}
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function subscribeToWebPush(vapidPublicKey) {
            if (!vapidPublicKey || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
            if (!("Notification" in window) || Notification.permission !== 'granted') return;
            try {
                const reg = await navigator.serviceWorker.ready;
                let sub = await reg.pushManager.getSubscription();
                if (!sub) {
                    sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
                    });
                }
                if (sub && API_URL && workerId) {
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'SAVE_WORKER_PUSH_SUBSCRIPTION',
                            workerId,
                            lang: currentLang,
                            subscription: sub.toJSON ? sub.toJSON() : sub
                        })
                    });
                }
            } catch (err) {
                console.warn('Web Push subscription warning:', err);
            }
        }

        function updateBellButtonUI() {
            const btn = document.getElementById('bellBtn');
            const icon = document.getElementById('notifIcon');
            const statusTxt = document.getElementById('bellStatusTxt');
            const promptBanner = document.getElementById('bellActivateBanner');
            const mainEl = document.getElementById('tasksContainer');
            if (!btn || !icon) return;

            const permGranted = ("Notification" in window) && Notification.permission === "granted";

            if (isBellEnabled && permGranted) {
                btn.className = "px-2.5 h-9 rounded-xl bg-emerald-600 text-white font-black text-xs flex items-center justify-center gap-1.5 transition-all shadow-md ring-2 ring-emerald-200";
                icon.className = "fas fa-bell text-sm";
                if (statusTxt) statusTxt.innerText = "ON";
                if (promptBanner) promptBanner.classList.add('hidden');
                if (mainEl) mainEl.className = "pt-24 px-3 max-w-lg mx-auto";
            } else if (isBellEnabled && !permGranted) {
                btn.className = "px-2.5 h-9 rounded-xl bg-amber-500 text-white font-black text-xs flex items-center justify-center gap-1.5 transition-all shadow-md animate-pulse";
                icon.className = "fas fa-bell text-sm";
                if (statusTxt) statusTxt.innerText = "!";
                if (promptBanner) promptBanner.classList.remove('hidden');
                if (mainEl) mainEl.className = "pt-36 px-3 max-w-lg mx-auto";
            } else {
                btn.className = "px-2.5 h-9 rounded-xl bg-slate-200 text-slate-500 font-bold text-xs flex items-center justify-center gap-1.5 transition-all border border-slate-300";
                icon.className = "fas fa-bell-slash text-sm";
                if (statusTxt) statusTxt.innerText = "OFF";
                if (promptBanner) promptBanner.classList.remove('hidden');
                if (mainEl) mainEl.className = "pt-36 px-3 max-w-lg mx-auto";
            }
        }

        async function enableBellAndPush(playTestSound = true) {
            isBellEnabled = true;
            localStorage.setItem('worker_bell_enabled', 'true');
            ensureAudioUnlocked();

            if ("Notification" in window && Notification.permission !== "granted") {
                try {
                    await Notification.requestPermission();
                } catch (e) {}
            }

            if (vapidPublicKeyGlobal) {
                await subscribeToWebPush(vapidPublicKeyGlobal);
            }
            requestScreenWakeLock();
            updateBellButtonUI();

            if (playTestSound) {
                playLoudDispatcherSiren(false);
            }
        }

        async function togglePersistentBell() {
            stopPersistentAlarmLoop();
            const permGranted = ("Notification" in window) && Notification.permission === "granted";
            if (!isBellEnabled || !permGranted) {
                await enableBellAndPush(true);
                alert(t.reqNotif);
            } else {
                // Already enabled: play a loud test chime on tap so the worker can verify loudness anytime!
                // Double confirm only if they actually want to mute it
                playLoudDispatcherSiren(false);
            }
        }

        async function requestScreenWakeLock() {
            if ('wakeLock' in navigator && document.visibilityState === 'visible') {
                try {
                    wakeLockSentinel = await navigator.wakeLock.request('screen');
                } catch (e) {}
            }
        }

        async function init() {
            applyLanguageUI();
            if (!tenantId || !workerId) {
                document.getElementById('tasksContainer').innerHTML = `<div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center text-red-600 font-bold mt-10">${t.notFound}</div>`;
                return;
            }

            // Unlock audio & stop repeating alarm on any tap anywhere on the page
            document.addEventListener('pointerdown', () => {
                ensureAudioUnlocked();
                if (alarmRepeatTimer) {
                    stopPersistentAlarmLoop();
                }
            }, { passive: true });

            // Listen for messages from Service Worker (Web Push arrived in background or notification clicked)
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.addEventListener('message', (event) => {
                    if (event.data && event.data.type === 'PUSH_TASK_ALERT') {
                        const p = event.data.payload || {};
                        startPersistentAlarmLoop(p.title || t.newTasks, Boolean(p.isRework));
                        fetchTasks(false);
                    } else if (event.data && event.data.type === 'STOP_ALARM_AND_REFRESH') {
                        stopPersistentAlarmLoop();
                        fetchTasks(true);
                    }
                });
            }

            await fetchTasks(true);

            // Poll every 10s when visible, and every 20s even in background so open tabs never miss tasks
            let bgTick = 0;
            pollingInterval = setInterval(() => {
                if (document.visibilityState === 'visible') {
                    fetchTasks(false);
                } else {
                    bgTick++;
                    if (bgTick % 2 === 0) fetchTasks(false);
                }
            }, 10000);

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestScreenWakeLock();
                    fetchTasks(false);
                }
            });
            window.addEventListener('online', () => fetchTasks(false));

            if (isBellEnabled && ("Notification" in window) && Notification.permission === "granted") {
                requestScreenWakeLock();
                updateBellButtonUI();
            }
        }

        async function fetchTasks(showSpin = false) {
            if (isFetchingTasks && !showSpin) return;
            isFetchingTasks = true;
            const refIcon = document.getElementById('refreshIcon');
            if (showSpin && refIcon) refIcon.classList.add('fa-spin');
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'GET_WORKER_TASKS', workerId, lang: currentLang }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                const data = await res.json();
                
                if (data.status !== 'success') {
                    if (data.error === 'Worker not found') {
                        document.getElementById('tasksContainer').innerHTML = `<div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center text-red-600 font-bold mt-10">${t.notFound}</div>`;
                        clearInterval(pollingInterval);
                    }
                    return;
                }

                if (data.vapidPublicKey && data.vapidPublicKey !== vapidPublicKeyGlobal) {
                    vapidPublicKeyGlobal = data.vapidPublicKey;
                    if (isBellEnabled && ("Notification" in window) && Notification.permission === "granted") {
                        subscribeToWebPush(vapidPublicKeyGlobal).catch(() => {});
                    }
                }

                workerInfo = data.worker;
                const brigade = workerInfo.teamName || '';
                const tenantDisplay = data.tenantName ? ` • ${data.tenantName}` : '';
                document.getElementById('uiWorkerName').innerText = `👷 ${workerInfo.name}${brigade ? ` (${brigade})` : ''}${tenantDisplay}`;
                if (data.tenantName) {
                    document.title = `${data.tenantName} - ${t.title}`;
                }

                const tasks = data.tasks || [];
                cachedTasks = tasks;

                // Update tasks count badge
                const badge = document.getElementById('tasksCountBadge');
                if (badge) {
                    badge.innerText = String(tasks.length);
                    if (tasks.length > 0) badge.classList.remove('hidden');
                    else badge.classList.add('hidden');
                }

                const newKeys = tasks.map(tk => tk.stateKey || tk.id);
                const hasNewOrUpdated = newKeys.some(k => !currentStateKeys.includes(k));
                if (hasNewOrUpdated && currentStateKeys.length > 0) {
                    const hasRework = tasks.some(tk => tk.isRework && !currentStateKeys.includes(tk.stateKey || tk.id));
                    startPersistentAlarmLoop(hasRework ? t.reworkAlert : t.newTasks, hasRework);
                }

                currentStateKeys = newKeys;
                renderTasks(tasks);

            } catch (err) {
                console.error(err);
            } finally {
                isFetchingTasks = false;
                if (refIcon) refIcon.classList.remove('fa-spin');
            }
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Helper to show translated text + original Hebrew sign name in brackets if they differ
        function formatBilingualLocation(translated, original) {
            const tr = (translated || '').trim();
            const orig = (original || '').trim();
            if (!tr) return escapeHtml(orig);
            if (!orig || tr.toLowerCase() === orig.toLowerCase() || currentLang === 'he') {
                return escapeHtml(tr);
            }
            return `${escapeHtml(tr)} <span class="text-xs font-semibold opacity-75" dir="rtl">(${escapeHtml(orig)})</span>`;
        }

                        <i class="fas fa-exclamation-triangle text-lg animate-bounce"></i>
                        <span class="font-black text-xs tracking-wide uppercase">${t.reworkBanner}</span>
                    </div>
                    ` : ''}

                    <!-- Top Status Row: Date, QR badge, Action Type -->
                    <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full ${isRework ? 'bg-rose-500' : (isQr ? 'bg-purple-600' : 'bg-amber-500')} animate-pulse"></span>
                            <span class="text-xs font-bold text-slate-500"><i class="far fa-clock mx-1"></i>${escapeHtml(tk.dateStr)}</span>
                            ${isQr ? `<span class="bg-purple-100 text-purple-800 border border-purple-300 text-xs font-black px-2 py-0.5 rounded-full"><i class="fas fa-qrcode mx-1"></i>${t.qrUrgent}</span>` : ''}
                        </div>
                        <span class="text-xs font-black px-3 py-1 rounded-full shadow-xs flex items-center gap-1.5 ${actionBadgeClass}">
                            <i class="fas ${actionIcon}"></i> ${actionLabel}

                    </div>

                    <!-- Manager Rework Note Callout -->
                    ${(isRework && tk.reworkNote) ? `

                    <!-- Location Block: Department & Room -->
                    <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-3 mb-3">
                        <div class="text-[11px] font-extrabold text-slate-400 uppercase mb-2 flex items-center gap-1.5">

                        </div>
                        ${(showArea || showSystem) ? `
                        <div class="flex flex-wrap gap-2 mt-2.5 pt-2 border-t border-slate-200/60">
                            ${showArea ? `<span class="text-xs font-bold bg-white text-slate-700 px-2.5 py-1 rounded-lg border border-slate-200"><span class="text-slate-400">${t.area}:</span> ${escapeHtml(tk.area)}</span>` : ''}
                            ${showSystem ? `<span class="text-xs font-bold bg-white text-slate-700 px-2.5 py-1 rounded-lg border border-slate-200"><span class="text-slate-400">${t.system}:</span> ${escapeHtml(tk.system)}</span>` : ''}
                        </div>
                        ` : ''}
                    </div>

                    <!-- What To Do Block: Defect + Complete Remarks -->
                    <div class="bg-amber-50/70 border border-amber-200/90 rounded-2xl p-3.5 mb-3">
                        <div class="text-[11px] font-extrabold text-amber-800 uppercase mb-1 flex items-center gap-1.5">
                            <i class="fas fa-tools text-amber-600"></i> ${t.defect}
                        </div>
                        <div class="text-base font-black text-slate-900 leading-snug">
                            ${escapeHtml(tk.defect)}
                        </div>
                        ${(tk.origDefect && tk.origDefect !== tk.defect && currentLang !== 'he') ? `
                        <div class="text-xs font-semibold text-slate-500 mt-0.5" dir="rtl">${escapeHtml(tk.origDefect)}</div>
                        ` : ''}

                        ${tk.notes ? `
                        <div class="mt-3 pt-2.5 border-t border-amber-200/80">
                            <div class="text-xs font-extrabold text-amber-900 mb-1 flex items-center gap-1.5">
                                <i class="fas fa-comment-dots text-amber-600"></i> ${t.notesTitle}:
                            </div>
                            <div class="bg-white/90 p-2.5 rounded-xl border border-amber-200 text-sm font-bold text-slate-800 whitespace-pre-line leading-relaxed">${escapeHtml(tk.notes)}</div>
                        </div>
                        ` : ''}
                    </div>

                    <!-- Photo Preview (if attached) -->
                    ${tk.photoUrl ? `
                    <div class="mb-3 rounded-2xl overflow-hidden border border-slate-200 bg-slate-900 relative cursor-pointer group" onclick="openFullscreen('${tk.photoUrl}')">
                        <img src="${tk.photoUrl}" class="w-full h-44 object-cover opacity-95 group-hover:opacity-100 transition-opacity">
                        <div class="absolute bottom-2 right-2 left-2 bg-black/65 backdrop-blur-xs text-white text-xs font-bold py-1.5 px-3 rounded-xl flex items-center justify-center gap-1.5">
                            <i class="fas fa-search-plus"></i> ${t.tapPhoto}
                        </div>
                    </div>` : ''}

                    <!-- Complete Action Button -->
                    <button onclick="openCompletionModal('${tk.id}')" class="w-full py-3.5 bg-indigo-600 text-white font-black rounded-2xl shadow-md hover:bg-indigo-700 active:bg-indigo-800 transition-all flex justify-center items-center gap-2 text-sm">
                        <i class="fas fa-check-double"></i> ${t.markDone}
                    </button>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        // Fullscreen
        function openFullscreen(url) {
            document.getElementById('fsImage').src = url;
            document.getElementById('fullscreenViewer').classList.add('active');
        }
        function closeFullscreen() {
            document.getElementById('fullscreenViewer').classList.remove('active');
        }

        // Completion Modal
        function openCompletionModal(id) {
            activeTaskId = id;
            const tk = cachedTasks.find(x => x.id === id);
            const sub = document.getElementById('modalTaskSubtitle');
            if (sub && tk) {
                sub.innerText = `${tk.department} • ${t.room}: ${tk.room} — ${tk.defect}`;
            }
            document.getElementById('completionComment').value = '';
            document.getElementById('photoPreview').src = '';
            document.getElementById('photoPreview').classList.add('hidden');
            document.getElementById('photoIcon').className = "fas fa-camera text-indigo-500 text-3xl mb-1.5";
            document.getElementById('photoText').innerText = t.photoBox;
            currentPhotoBase64 = null;
            document.getElementById('completionModal').classList.add('active');
        }

        function closeCompletionModal() {
            document.getElementById('completionModal').classList.remove('active');
            activeTaskId = null;
        }

        function handlePhotoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const scale = Math.min(1000 / img.width, 1000 / img.height, 1);
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    const prev = document.getElementById('photoPreview');
                    prev.src = currentPhotoBase64;
                    prev.classList.remove('hidden');
                    document.getElementById('photoIcon').className = "fas fa-check-circle text-emerald-500 text-2xl mb-1";
                    document.getElementById('photoText').innerText = t.photoSelected;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function submitTaskCompletion() {
            if (!activeTaskId) return;

            const btn = document.getElementById('submitCompletionBtn');
            const comment = document.getElementById('completionComment').value.trim();

            btn.disabled = true;
            document.getElementById('submitBtnTxt').innerHTML = `<i class="fas fa-spinner fa-spin mx-2"></i> ${t.loading}`;

            let finalPhotoUrl = null;

            try {
                // Send compressed base64 directly to backend; backend uploads to freeimage.host / Imgur / DataURI
                if (currentPhotoBase64) {
                    finalPhotoUrl = currentPhotoBase64;
                }

                const payload = {
                    action: 'WORKER_MARK_COMPLETED',
                    taskId: activeTaskId,
                    workerId: workerId,
                    afterPhotoUrl: finalPhotoUrl,
                    comment: comment
                };

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 20000);
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                if (!res.ok) throw new Error("Server error");
                
                closeCompletionModal();
                await fetchTasks(true);

            } catch (e) {
                console.error(e);
                alert(t.error);
            } finally {
                btn.disabled = false;
                document.getElementById('submitBtnTxt').innerText = t.submit;
            }
        }

        // PWA and Service Worker Logic
        let deferredPrompt;
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('SW registered!', reg);
                }).catch(err => console.log('SW registration failed', err));
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            showInstallPromotion();
        });

        function showInstallPromotion() {
            const banner = document.createElement('div');
            banner.id = 'pwa-install-banner';
            banner.className = 'fixed bottom-0 left-0 w-full bg-indigo-600 text-white p-4 flex justify-between items-center z-50 shadow-2xl rounded-t-xl';
            banner.innerHTML = `
                <div class="flex items-center gap-3">
                    <i class="fas fa-download text-2xl"></i>
                    <div>
                        <div class="font-bold">התקן אפליקציה / Install App</div>
                        <div class="text-xs opacity-80">לגישה מהירה ונוחה</div>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button id="pwa-install-btn" class="bg-white text-indigo-600 px-4 py-2 rounded-full font-bold text-sm shadow-md">התקן</button>
                    <button id="pwa-dismiss-btn" class="text-indigo-200 p-2"><i class="fas fa-times"></i></button>
                </div>
            `;
            document.body.appendChild(banner);

            document.getElementById('pwa-install-btn').addEventListener('click', async () => {
                banner.remove();
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    await deferredPrompt.userChoice;
                    deferredPrompt = null;
                }
            });

            document.getElementById('pwa-dismiss-btn').addEventListener('click', () => {
                banner.remove();
            });
        }

        init();
    </script>
</body>
</html>
